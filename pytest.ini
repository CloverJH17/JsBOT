[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
markers =
    gui: pruebas que requieren CustomTkinter/Tkinter
    security: pruebas de seguridad y validación de entradas
    slow: pruebas de estrés o rendimiento
    external: pruebas que requieren servicios externos; no se ejecutan por defecto
